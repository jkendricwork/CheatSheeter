services:
  # PostgreSQL Database
  database:
    image: postgres:14-alpine
    container_name: cheatsheeter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cheatsheeter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cheatsheeter-network
    stop_grace_period: 10s

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cheatsheeter-backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@database:5432/cheatsheeter
      # Allow all origins in Docker since nginx proxies the requests
      CORS_ORIGIN: "*"
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cheatsheeter-network
    restart: unless-stopped
    stop_grace_period: 10s

  # Frontend Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # For LAN access, use the server's IP address
        # For localhost only, use http://localhost:3001
        VITE_API_URL: "http://192.168.1.70:3001"
    container_name: cheatsheeter-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cheatsheeter-network
    restart: unless-stopped
    stop_grace_period: 5s

volumes:
  postgres_data:

networks:
  cheatsheeter-network:
    driver: bridge
